name: refresh-cockpit

on:
  schedule:
    - cron: '0 6 * * *'      # daily 06:00 UTC — FREE price refresh only
  workflow_dispatch:
    inputs:
      run_analysis:
        description: 'Also refresh analysis (uses paid API, ~cents)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-cockpit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Update prices (free EIA feed, no key)
        run: node scripts/refresh-prices.js

      - name: Update analysis (paid, only if requested)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_analysis == true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COCKPIT_MODEL: 'claude-haiku-4-5'
        run: node scripts/analyze.js

      - name: Commit & push (with rebase + retry)
        run: |
          git config user.name  "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          if git diff --quiet -- data/state.json; then
            echo "No change - nothing to commit."; exit 0
          fi
          git add data/state.json
          git commit -m "auto: cockpit refresh $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep 5
          done
          echo "push failed after retries"; exit 1
